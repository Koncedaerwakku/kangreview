<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umpan Balik Pelanggan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .star-btn {
            transition: transform 0.15s ease, color 0.15s ease;
        }
        .star-btn:active {
            transform: scale(1.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Card Utama Rating -->
    <div id="main-card" class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 text-center border border-slate-100 transition-all duration-300">
        
        <!-- Logo / Icon Header -->
        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
            <i class="fa-solid fa-face-smile"></i>
        </div>

        <!-- Judul Dinamis -->
        <h1 id="shop-name" class="text-xl font-extrabold text-slate-800 mb-2 leading-tight">Gimana Pengalaman Kamu Hari Ini?</h1>
        <p class="text-slate-500 text-sm mb-6">5 detik masukan dari kamu berharga banget buat meningkatkan kualitas layanan kami 😊</p>

        <!-- Bintang Rating -->
        <div class="flex justify-center gap-3 text-4xl text-slate-200 mb-3" id="star-container">
            <button onclick="setRating(1)" class="star-btn hover:text-amber-400 focus:outline-none"><i class="fa-solid fa-star"></i></button>
            <button onclick="setRating(2)" class="star-btn hover:text-amber-400 focus:outline-none"><i class="fa-solid fa-star"></i></button>
            <button onclick="setRating(3)" class="star-btn hover:text-amber-400 focus:outline-none"><i class="fa-solid fa-star"></i></button>
            <button onclick="setRating(4)" class="star-btn hover:text-amber-400 focus:outline-none"><i class="fa-solid fa-star"></i></button>
            <button onclick="setRating(5)" class="star-btn hover:text-amber-400 focus:outline-none"><i class="fa-solid fa-star"></i></button>
        </div>

        <!-- Text Keterangan Bintang -->
        <div id="rating-text" class="h-6 text-sm font-bold text-amber-500 mb-4 transition-all"></div>

        <!-- Form Saran Opsional -->
        <div id="comment-box" class="mb-5 hidden transition-all duration-300 text-left">
            <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1">Tulis kesan / pesan kamu (Opsional):</label>
            <textarea id="user-comment" rows="3" placeholder="Tulis masukan di sini..." class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none bg-slate-50"></textarea>
        </div>

        <!-- Tombol Kirim -->
        <button id="submit-btn" onclick="submitReview()" disabled class="w-full bg-slate-200 text-slate-400 font-bold py-3.5 rounded-xl transition duration-200 shadow-sm cursor-not-allowed">
            Kirim Ulasan
        </button>
    </div>

    <!-- Modal/Pop-up Sukses Rahasia (Untuk Bintang 1-3) -->
    <div id="success-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl transform transition-all scale-100">
            <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2 class="text-xl font-extrabold text-slate-800 mb-2">Terima Kasih Banyak!</h2>
            <p class="text-slate-600 text-sm mb-6 leading-relaxed">Ulasan dan masukan kamu sudah berhasil tercatat di sistem pusat evaluasi layanan kami.</p>
            <button onclick="redirectToWA()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95">
                Selesaikan
            </button>
        </div>
    </div>

    <script>
        let selectedRating = 0;
        let whatsappNumber = "";
        let googleReviewUrl = "";

        const ratingLabels = {
            1: "Sangat Kecewa 😞",
            2: "Butuh Perbaikan 😐",
            3: "Cukup Baik 🙂",
            4: "Sangat Baik 😊",
            5: "Sangat Memuaskan! 🤩"
        };

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const shop = urlParams.get('toko');
            whatsappNumber = urlParams.get('wa') || "";
            googleReviewUrl = urlParams.get('g') || "";

            if (shop) {
                document.getElementById('shop-name').innerText = `Gimana Pengalaman Kamu di ${decodeURIComponent(shop)} Hari Ini?`;
            }
        };

        function setRating(rating) {
            selectedRating = rating;
            const stars = document.querySelectorAll('#star-container .star-btn');
            
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.remove('text-slate-200');
                    star.classList.add('text-amber-400');
                } else {
                    star.classList.remove('text-amber-400');
                    star.classList.add('text-slate-200');
                }
            });

            document.getElementById('rating-text').innerText = ratingLabels[rating];

            // Munculkan kolom catatan jika bintang diisi
            document.getElementById('comment-box').classList.remove('hidden');

            const btn = document.getElementById('submit-btn');
            btn.disabled = false;
            btn.classList.remove('bg-slate-200', 'text-slate-400', 'cursor-not-allowed');
            btn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-md', 'active:scale-95');
        }

        function submitReview() {
            if (selectedRating === 0) return;

            if (selectedRating >= 4) {
                // Bintang 4 & 5 -> Langsung lempar ke Google Review Publik
                if (googleReviewUrl) {
                    window.location.href = googleReviewUrl;
                } else {
                    alert("Terima kasih atas ulasan positif Anda!");
                }
            } else {
                // Bintang 1, 2, 3 -> Tampilkan Pop-up Ucapan Terima Kasih dulu
                document.getElementById('success-modal').classList.remove('hidden');
            }
        }

        function redirectToWA() {
            if (whatsappNumber) {
                const comment = document.getElementById('user-comment').value;
                let text = `Halo Management, ada masukan dari pelanggan (Rating Bintang ${selectedRating}).`;
                if (comment.trim() !== "") {
                    text += `\n\nCatatan Pelanggan: "${comment}"`;
                }
                const message = encodeURIComponent(text);
                window.location.href = `https://wa.me/${whatsappNumber}?text=${message}`;
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
