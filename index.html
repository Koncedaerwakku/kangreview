<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulasan Bisnis & Manajemen QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <!-- HALAMAN DASHBOARD / ADMIN PANEL -->
    <div id="adminPanel" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-6 sm:p-8 border border-slate-100">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
            <div>
                <h2 class="text-xl font-bold text-slate-900">Manajemen QR & Reseller</h2>
                <p class="text-xs text-slate-500">Kelola tautan dan QR code dinamis tanpa cetak ulang akrilik.</p>
            </div>
            <button onclick="openForm()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2 px-4 rounded-xl shadow transition">
                + Tambah Bisnis Baru
            </button>
        </div>

        <!-- Form Input / Edit -->
        <div id="businessForm" class="bg-slate-50 p-5 rounded-2xl mb-6 border border-slate-200 hidden">
            <h3 id="formTitle" class="font-bold text-slate-800 mb-4 text-sm">Daftarkan Bisnis Baru</h3>
            <input type="hidden" id="editSlug">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Slug / ID Pendek (Contoh: unclefang, kedaikopi)</label>
                    <input type="text" id="inputSlug" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-slate-500" placeholder="tanpa spasi, misal: unclefang">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Bisnis</label>
                    <input type="text" id="inputName" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-slate-500" placeholder="Contoh: Es Potong Singapore Uncle Fang">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Link Tujuan (Google Review / URL Asli)</label>
                    <input type="url" id="inputUrl" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-slate-500" placeholder="https://g.page/r/...">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Logo Bisnis</label>
                    <input type="file" id="inputLogo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-200 file:text-slate-700 hover:file:bg-slate-300">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="closeForm()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold py-2 px-4 rounded-xl">Batal</button>
                    <button onclick="saveBusiness()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-2 px-5 rounded-xl">Simpan ke Server</button>
                </div>
            </div>
        </div>

        <!-- Daftar List Bisnis -->
        <div class="space-y-3" id="businessList">
            <p class="text-xs text-slate-400 text-center py-6">Memuat data dari server...</p>
        </div>
    </div>

    <!-- MODAL QR CODE & LINK -->
    <div id="qrModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl relative">
            <h3 class="font-bold text-slate-900 text-lg mb-1" id="modalBusinessName">QR Code Siap Pakai</h3>
            <p class="text-xs text-slate-500 mb-4">Scan QR atau gunakan link di bawah untuk akrilik reseller.</p>
            
            <div class="flex justify-center mb-4">
                <div id="qrcodeContainer" class="p-3 bg-white border border-slate-200 rounded-2xl shadow-sm inline-block"></div>
            </div>

            <div class="mb-4 text-left">
                <label class="block text-xs font-semibold text-slate-500 mb-1">Short Link (Dynamic URL)</label>
                <input type="text" id="modalShortLink" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 select-all">
            </div>

            <div class="flex gap-2">
                <button onclick="downloadQR()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-2.5 rounded-xl">Download QR</button>
                <button onclick="closeQRModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold py-2.5 px-4 rounded-xl">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        async function loadBusinesses() {
            try {
                const res = await fetch('/api/businesses');
                const data = await res.json();
                renderAdminList(data);
            } catch (e) {
                document.getElementById('businessList').innerHTML = '<p class="text-xs text-rose-500 text-center py-6">Gagal memuat data dari server.</p>';
            }
        }

        function renderAdminList(db) {
            const listEl = document.getElementById('businessList');
            listEl.innerHTML = '';

            const keys = Object.keys(db);
            if (keys.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Belum ada bisnis terdaftar. Klik "+ Tambah Bisnis Baru".</p>';
                return;
            }

            keys.forEach(slug => {
                const item = db[slug];
                const shortLink = window.location.origin + '/' + slug;
                
                listEl.innerHTML += `
                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-slate-200 overflow-hidden flex-shrink-0 flex items-center justify-center">
                                ${item.logo ? `<img src="${item.logo}" class="w-full h-full object-cover">` : '<span class="text-[10px] text-slate-400">Logo</span>'}
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm">${item.name} <span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full ml-1">/${slug}</span></h4>
                                <p class="text-[11px] text-slate-500 truncate max-w-xs">Destinasi: ${item.url}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                            <button onclick="showQR('${slug}', '${item.name}')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold py-2 px-3 rounded-xl">QR Code</button>
                            <button onclick="editBusiness('${slug}', '${item.name}', '${item.url}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-3 rounded-xl">Edit Link</button>
                            <button onclick="deleteBusiness('${slug}')" class="bg-rose-100 hover:bg-rose-200 text-rose-600 text-xs font-semibold py-2 px-3 rounded-xl">Hapus</button>
                        </div>
                    </div>
                `;
            });
        }

        function openForm(isEdit = false) {
            document.getElementById('businessForm').classList.remove('hidden');
            if (!isEdit) {
                document.getElementById('formTitle').innerText = "Daftarkan Bisnis Baru";
                document.getElementById('editSlug').value = "";
                document.getElementById('inputSlug.value') = "";
                document.getElementById('inputSlug').disabled = false;
                document.getElementById('inputName').value = "";
                document.getElementById('inputUrl').value = "";
                document.getElementById('inputLogo').value = "";
            }
        }

        function closeForm() {
            document.getElementById('businessForm').classList.add('hidden');
        }

        function editBusiness(slug, name, url) {
            openForm(true);
            document.getElementById('formTitle').innerText = "Edit Link & Data Bisnis: " + name;
            document.getElementById('editSlug').value = slug;
            document.getElementById('inputSlug').value = slug;
            document.getElementById('inputSlug').disabled = true; // Slug tidak boleh diubah saat edit
            document.getElementById('inputName').value = name;
            document.getElementById('inputUrl').value = url;
            document.getElementById('inputLogo').value = "";
        }

        async function saveBusiness() {
            const slug = document.getElementById('inputSlug').value.trim().toLowerCase().replace(/\s+/g, '-');
            const name = document.getElementById('inputName').value.trim();
            const url = document.getElementById('inputUrl').value.trim();
            const logoFile = document.getElementById('inputLogo').files[0];

            if (!slug || !name || !url) {
                alert('Slug, Nama Bisnis, dan Link Tujuan wajib diisi!');
                return;
            }

            async function sendData(logoBase64) {
                const payload = { slug, name, url };
                if (logoBase64) payload.logo = logoBase64;

                const res = await fetch('/api/businesses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeForm();
                    loadBusinesses();
                } else {
                    alert('Gagal menyimpan data.');
                }
            }

            if (logoFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 300;
                        canvas.height = 300;
                        ctx.drawImage(img, 0, 0, 300, 300);
                        sendData(canvas.toDataURL('image/jpeg', 0.7));
                    }
                }
                reader.readAsDataURL(logoFile);
            } else {
                sendData(null);
            }
        }

        async function deleteBusiness(slug) {
            if (confirm('Yakin ingin menghapus bisnis ini?')) {
                const res = await fetch('/api/businesses?slug=' + slug, { method: 'DELETE' });
                if (res.ok) loadBusinesses();
                else alert('Gagal menghapus.');
            }
        }

        function showQR(slug, name) {
            const shortLink = window.location.origin + '/' + slug;
            document.getElementById('modalBusinessName').innerText = name;
            document.getElementById('modalShortLink').value = shortLink;
            
            const container = document.getElementById('qrcodeContainer');
            container.innerHTML = '';
            new QRCode(container, {
                text: shortLink,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById('qrModal').classList.remove('hidden');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcodeContainer canvas');
            if (canvas) {
                const image = canvas.toDataURL("image/png");
                const a = document.createElement('a');
                a.href = image;
                a.download = 'QR-Code-Reseller.png';
                a.click();
            }
        }

        // Load data saat halaman dibuka
        loadBusinesses();
    </script>
</body>
</html>
