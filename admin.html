<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Generator Review Link</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 w-full max-w-lg">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white mb-1"><i class="fa-solid fa-qrcode text-blue-500 mr-2"></i>Generator Link & QR Code</h1>
            <p class="text-slate-400 text-sm">Buat link khusus kartu NFC & QR Code untuk Klien</p>
        </div>

        <div class="space-y-4">
            <!-- NAMA TOKO -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Nama Toko / Cafe / Bisnis <span class="text-red-400">*</span></label>
                <input type="text" id="storeName" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 text-sm" placeholder="Contoh: Pusat Buket & Hantaran Kikie">
            </div>

            <!-- NOMOR WA OWNER (OPSIONAL) -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Nomor WhatsApp Owner <span class="text-slate-500 font-normal">(Opsional)</span></label>
                <input type="text" id="waNumber" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 text-sm" placeholder="Awalan 62 atau 08 (Boleh kosongkan jika tanpa WA)">
            </div>

            <!-- LINK GOOGLE REVIEW -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Link Google Review Klien <span class="text-red-400">*</span></label>
                <input type="url" id="googleUrl" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 text-sm" placeholder="https://g.page/r/...">
            </div>

            <!-- BUTTON GENERATE -->
            <button onclick="generateLink()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 mt-2">
                Generate Link & QR Code
            </button>
        </div>

        <!-- HASIL GENERATE -->
        <div id="result-box" class="hidden mt-6 pt-6 border-t border-slate-700 text-center">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Link Hasil Aktivasi:</p>
            <div class="flex gap-2 mb-4">
                <input type="text" id="result-url" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-blue-400 font-mono">
                <button onclick="copyURL()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-xs font-semibold">Salin</button>
            </div>

            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">QR Code Tautan:</p>
            <div class="bg-white p-3 rounded-xl inline-block shadow-md">
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <script>
        function generateLink() {
            const toko = document.getElementById('storeName').value.trim();
            const wa = document.getElementById('waNumber').value.trim();
            const googleUrl = document.getElementById('googleUrl').value.trim();

            if (!toko || !googleUrl) {
                alert("Mohon isi Nama Toko dan Link Google Review terlebih dahulu!");
                return;
            }

            const baseUrl = window.location.origin;
            let finalUrl = `${baseUrl}/?toko=${encodeURIComponent(toko)}&g=${encodeURIComponent(googleUrl)}`;
            
            if (wa !== '') {
                finalUrl += `&wa=${encodeURIComponent(wa)}`;
            }

            document.getElementById('result-url').value = finalUrl;
            
            // Generate QR Code
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: finalUrl,
                width: 180,
                height: 180
            });

            document.getElementById('result-box').classList.remove('hidden');
        }

        function copyURL() {
            const urlInput = document.getElementById('result-url');
            urlInput.select();
            document.execCommand('copy');
            alert("Link berhasil disalin ke clipboard!");
        }
    </script>
</body>
</html>
